# pacman.conf used to install the live system (and copied into it)
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
DisableSandbox
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# local AUR builds (built on the build host, unsigned)
[lacuna]
SigLevel = Never
Server = file:///build/repo

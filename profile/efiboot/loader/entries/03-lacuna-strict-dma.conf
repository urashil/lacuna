title    Lacuna (AMD: forced IOMMU isolation; black screen on some AMD laptops)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 amd_iommu=force_isolation

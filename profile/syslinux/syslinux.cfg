UI menu.c32
MENU TITLE Lacuna
TIMEOUT 30
DEFAULT lacuna

LABEL lacuna
MENU LABEL Lacuna (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL stickless
MENU LABEL Lacuna (stickless: loads into RAM, then remove the stick)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 copytoram=y lacuna.stickless

LABEL nomodeset
MENU LABEL Lacuna (troubleshooting: no GPU modesetting, verbose)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset systemd.show_status=1 lacuna.nogui

LABEL strictdma
MENU LABEL Lacuna (AMD: forced IOMMU isolation; may not boot on every AMD laptop)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 amd_iommu=force_isolation

# troubleshooting entry ("lacuna.nogui"): there is no greeter and `amnesia` has no password by default, so tty1
# logs in by itself; on a normal boot greetd owns tty1 and this getty doesn't run
[Unit]
ConditionKernelCommandLine=lacuna.nogui
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin amnesia %I $TERM
